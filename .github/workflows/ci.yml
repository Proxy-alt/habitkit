name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Theme JSON validation ───────────────────────────────────────────────────
  validate-themes:
    name: Validate Community Themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate themes.json
        run: |
          ajv validate \
            -s .github/theme-schema.json \
            -d HabitNookUI/Sources/Themes/Community/themes.json

  # ── Hardcoded color enforcement ─────────────────────────────────────────────
  lint-colors:
    name: No Hardcoded Colors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for raw hex strings in Swift files
        run: |
          VIOLATIONS=$(grep -rn \
            -e 'Color(red:' \
            -e 'Color(\.sRGB' \
            -e 'UIColor(red:' \
            -e '"#[0-9a-fA-F]\{3,8\}"' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . | grep -v "NookTheme.swift" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Hardcoded color literals found:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use NookTheme tokens (theme.colors.primary etc.) instead."
            exit 1
          fi
          echo "✅ No hardcoded colors."

  # ── Hardcoded font enforcement ──────────────────────────────────────────────
  lint-fonts:
    name: No Hardcoded Font Sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded font sizes
        run: |
          VIOLATIONS=$(grep -rn '\.font(\.system(size:' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            --exclude="NookIconSize*.swift" \
            . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Hardcoded font sizes found:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use NookIconSize or NookFont constants instead of .font(.system(size:))."
            exit 1
          fi
          echo "✅ No hardcoded font sizes."

  # ── Force-unwrap enforcement ─────────────────────────────────────────────────
  lint-force-unwrap:
    name: No Force Unwrap / Force Try
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for try! in production code
        run: |
          VIOLATIONS=$(grep -rn 'try!' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Force-try (try!) found in production code:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No try! found."

      - name: Check for force-unwrap in production code
        run: |
          # Match trailing ! that is not a logical-not operator.
          # Exclude: comments, string literals, fatalError lines (documented exception).
          VIOLATIONS=$(grep -rn '[a-zA-Z0-9_)]!' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . | grep -v '// ' | grep -v 'fatalError' | grep -v 'precondition' \
              | grep -v '"[^"]*![^"]*"' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Force-unwrap (!) found in production code:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use guard-let, if-let, or explicit error handling instead."
            exit 1
          fi
          echo "✅ No force-unwrap found."

  # ── Package graph / import boundary check ───────────────────────────────────
  lint-imports:
    name: Package Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HabitNookCore must not import SwiftUI
        run: |
          # AlarmManager is exempt: AlarmKit's AlarmAttributes takes a SwiftUI Color tint.
          VIOLATIONS=$(grep -rn '^import SwiftUI' \
            HabitNookCore/Sources/ | grep -v 'Alarms/AlarmManager.swift' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookCore imports SwiftUI (forbidden):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookCore has no SwiftUI imports."

      - name: HabitNookCore must not import HabitNookUI or HabitNookIntents
        run: |
          VIOLATIONS=$(grep -rn -e '^import HabitNookUI' -e '^import HabitNookIntents' \
            HabitNookCore/Sources/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookCore imports a downstream package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookCore has no downstream package imports."

      - name: HabitNookIntents must not import SwiftUI or HabitNookUI
        run: |
          VIOLATIONS=$(grep -rn -e '^import SwiftUI' -e '^import HabitNookUI' \
            HabitNookIntents/Sources/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookIntents imports a forbidden package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookIntents import boundaries clean."

  # ── swift-format ─────────────────────────────────────────────────────────────
  swift-format:
    name: swift-format Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install swift-format
        run: brew install swift-format

      - name: Run swift-format lint
        run: swift-format lint --recursive .

  # ── Builds ────────────────────────────────────────────────────────────────────
  # HabitNookCore uses iOS-only frameworks (AlarmKit, CoreNFC, WatchConnectivity),
  # so a bare `swift build` (macOS host) can't compile it. Build for the iOS
  # Simulator from the root Package.swift instead, which is what the app links.
  build:
    name: Build App
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app
        run: |
          xcodebuild build \
            -project HabitNook.xcodeproj \
            -scheme HabitNook \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  # ── Tests ─────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: macos-26
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test HabitNookCore
        run: |
          # With HabitNook.xcodeproj present, xcodebuild ignores Package.swift and
          # can't see the package's test scheme. Move it aside for this job.
          mv HabitNook.xcodeproj "$RUNNER_TEMP/"
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devices = json.load(sys.stdin)['devices']
          ids = [d['udid'] for runtime, ds in devices.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(ids[-1] if ids else '')
          ")
          echo "Using simulator $SIM_ID"
          xcodebuild test \
            -scheme HabitNook-Package \
            -destination "id=$SIM_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      # Not yet a gate: Xcode records no line data for SwiftPM package
      # frameworks here (HabitNookCore reports 0/0 executable lines), so the
      # 80% STYLE_GUIDE threshold can't be measured. Make this fail again once
      # coverage reports real numbers.
      - name: Report coverage
        run: |
          xcrun xccov view --report --only-targets --json TestResults.xcresult | python3 -c "
          import sys, json
          for t in json.load(sys.stdin):
              if t['name'] == 'HabitNookCore':
                  print(f\"HabitNookCore line coverage: {t['coveredLines']}/{t['executableLines']} ({t['lineCoverage']*100:.0f}%)\")
          "

  # ── Preview presence check ────────────────────────────────────────────────────
  check-previews:
    name: Previews on All UI Views
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify #Preview in HabitNookUI component files
        run: |
          MISSING=""
          for f in HabitNookUI/Sources/Components/*.swift; do
            if ! grep -q '#Preview' "$f"; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ These component files are missing #Preview blocks:"
            echo -e "$MISSING"
            exit 1
          fi
          echo "✅ All component files have #Preview blocks."
