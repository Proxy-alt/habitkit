name: HabitNook
options:
  bundleIdPrefix: com.habitnook
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  HabitNook:
    path: .
  NookCore:
    path: Packages/NookCore
  NookUI:
    path: Packages/NookUI

targets:
  HabitNook:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App/Sources
        excludes:
          - Info.plist
          - HabitNook.entitlements
          - PrivacyInfo.xcprivacy
    resources:
      - path: App/Sources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitnook.app
        PRODUCT_MODULE_NAME: HabitNook
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Sources/HabitNook.entitlements
    scheme: {}
    dependencies:
      - package: HabitNook
        product: HabitNookCore
      - package: HabitNook
        product: HabitNookUI
      - package: NookCore
      - package: NookUI
      - package: HabitNook
        product: HabitNookIntents
      - target: HabitNookWidgets
        embed: true

  HabitNookWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widgets/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.habitnook.app.widgets
        PRODUCT_MODULE_NAME: HabitNookWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
    scheme: {}
    dependencies:
      - package: HabitNook
        product: HabitNookCore
      - package: HabitNook
        product: HabitNookUI
      - package: NookCore
      - package: NookUI
