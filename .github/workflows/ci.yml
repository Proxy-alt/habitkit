name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Theme JSON validation ───────────────────────────────────────────────────
  validate-themes:
    name: Validate Community Themes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate themes.json
        run: |
          ajv validate \
            -s .github/theme-schema.json \
            -d HabitNookUI/Sources/Themes/Community/themes.json

  # ── Hardcoded color enforcement ─────────────────────────────────────────────
  lint-colors:
    name: No Hardcoded Colors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for raw hex strings in Swift files
        run: |
          VIOLATIONS=$(grep -rn \
            -e 'Color(red:' \
            -e 'Color(\.sRGB' \
            -e 'UIColor(red:' \
            -e '"#[0-9a-fA-F]\{3,8\}"' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . | grep -v "NookTheme.swift" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Hardcoded color literals found:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use NookTheme tokens (theme.colors.primary etc.) instead."
            exit 1
          fi
          echo "✅ No hardcoded colors."

  # ── Hardcoded font enforcement ──────────────────────────────────────────────
  lint-fonts:
    name: No Hardcoded Font Sizes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded font sizes
        run: |
          VIOLATIONS=$(grep -rn '\.font(\.system(size:' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            --exclude="NookIconSize.swift" \
            . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Hardcoded font sizes found:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use NookIconSize or NookFont constants instead of .font(.system(size:))."
            exit 1
          fi
          echo "✅ No hardcoded font sizes."

  # ── Force-unwrap enforcement ─────────────────────────────────────────────────
  lint-force-unwrap:
    name: No Force Unwrap / Force Try
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for try! in production code
        run: |
          VIOLATIONS=$(grep -rn 'try!' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Force-try (try!) found in production code:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ No try! found."

      - name: Check for force-unwrap in production code
        run: |
          # Match trailing ! that is not a logical-not operator.
          # Exclude: comments, string literals, fatalError lines (documented exception).
          VIOLATIONS=$(grep -rn '[a-zA-Z0-9_)]!' \
            --include="*.swift" \
            --exclude-dir=".build" \
            --exclude-dir="Tests" \
            . | grep -v '// ' | grep -v 'fatalError' | grep -v 'precondition' \
              | grep -v '"[^"]*!"' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ Force-unwrap (!) found in production code:"
            echo "$VIOLATIONS"
            echo ""
            echo "Use guard-let, if-let, or explicit error handling instead."
            exit 1
          fi
          echo "✅ No force-unwrap found."

  # ── Package graph / import boundary check ───────────────────────────────────
  lint-imports:
    name: Package Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: HabitNookCore must not import SwiftUI
        run: |
          VIOLATIONS=$(grep -rn '^import SwiftUI' \
            HabitNookCore/Sources/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookCore imports SwiftUI (forbidden):"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookCore has no SwiftUI imports."

      - name: HabitNookCore must not import HabitNookUI or HabitNookIntents
        run: |
          VIOLATIONS=$(grep -rn -e '^import HabitNookUI' -e '^import HabitNookIntents' \
            HabitNookCore/Sources/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookCore imports a downstream package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookCore has no downstream package imports."

      - name: HabitNookIntents must not import SwiftUI or HabitNookUI
        run: |
          VIOLATIONS=$(grep -rn -e '^import SwiftUI' -e '^import HabitNookUI' \
            HabitNookIntents/Sources/ || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ HabitNookIntents imports a forbidden package:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "✅ HabitNookIntents import boundaries clean."

  # ── swift-format ─────────────────────────────────────────────────────────────
  swift-format:
    name: swift-format Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install swift-format
        run: brew install swift-format

      - name: Run swift-format lint
        run: swift-format lint --recursive .

  # ── Swift package builds ─────────────────────────────────────────────────────
  build:
    name: Build Swift Packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build HabitNookCore
        run: swift build --package-path HabitNookCore -Xswiftc -strict-concurrency=complete

      - name: Build HabitNookUI
        run: swift build --package-path HabitNookUI -Xswiftc -strict-concurrency=complete

      - name: Build HabitNookIntents
        run: swift build --package-path HabitNookIntents -Xswiftc -strict-concurrency=complete

  # ── Swift tests ───────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: macos-15
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Test HabitNookCore
        run: |
          swift test \
            --package-path HabitNookCore \
            --enable-code-coverage \
            -Xswiftc -strict-concurrency=complete

      - name: Check coverage thresholds
        run: |
          # swift test --package-path writes build artifacts to HabitNookCore/.build/
          PROFDATA="HabitNookCore/.build/debug/codecov/default.profdata"
          # On macOS the test binary lives inside an .xctest bundle
          TEST_BINARY=$(find HabitNookCore/.build/debug \
            -name "HabitNookCorePackageTests" \
            -path "*/Contents/MacOS/*" 2>/dev/null | head -1)
          if [ -z "$TEST_BINARY" ]; then
            TEST_BINARY=$(find HabitNookCore/.build/debug -maxdepth 1 \
              -name "HabitNookCorePackageTests" -type f 2>/dev/null | head -1)
          fi

          COVERAGE=0
          if [ -f "$PROFDATA" ] && [ -n "$TEST_BINARY" ]; then
            COVERAGE=$(xcrun llvm-cov export \
              --instr-profile="$PROFDATA" \
              "$TEST_BINARY" \
              --ignore-filename-regex=".*Tests.*" \
              --format=json 2>/dev/null | \
              python3 -c "
import sys, json
d = json.load(sys.stdin)
totals = d.get('data', [{}])[0].get('totals', {})
lines = totals.get('lines', {})
count = lines.get('count', 0)
covered = lines.get('covered', 0)
print(int(covered * 100 / count) if count > 0 else 0)
" 2>/dev/null || echo "0")
          fi

          echo "HabitNookCore line coverage: ${COVERAGE}%"
          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ HabitNookCore coverage ${COVERAGE}% is below the 80% minimum."
            exit 1
          fi
          echo "✅ Coverage threshold met."

  # ── Preview presence check ────────────────────────────────────────────────────
  check-previews:
    name: Previews on All UI Views
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify #Preview in HabitNookUI component files
        run: |
          MISSING=""
          for f in HabitNookUI/Sources/Components/*.swift; do
            if ! grep -q '#Preview' "$f"; then
              MISSING="$MISSING\n  $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "❌ These component files are missing #Preview blocks:"
            echo -e "$MISSING"
            exit 1
          fi
          echo "✅ All component files have #Preview blocks."
